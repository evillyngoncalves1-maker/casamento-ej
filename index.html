<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Evillyn & João — Câmera com moldura</title>
<meta name="description" content="Tire sua foto com a moldura do casamento de Evillyn e João e compartilhe nos Stories." />
<meta name="theme-color" content="#1E3024" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="molduras/icone.png" />
<link rel="apple-touch-icon" href="molduras/icone.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Dancing+Script:wght@600&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root {
    --musgo: #2F4838; --musgo-escuro: #1E3024; --papel: #FAF3E8; --salvia: #778676; --salvia-claro: #B7C3B4;
    --seguro-topo: env(safe-area-inset-top, 0px); --seguro-base: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--musgo-escuro); color: var(--papel);
    font-family: "Cormorant Garamond", Georgia, serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100dvh; padding-top: var(--seguro-topo); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--salvia-claro); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* Palco 9:16 — o que aparece aqui é exatamente o que sai na foto */
  .palco-area { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 10px 12px 0; }
  .palco { position: relative; aspect-ratio: 9 / 16; height: 100%; max-width: 100%; max-height: calc((100vw - 24px) * 16 / 9);
    border-radius: 18px; overflow: hidden; background: #000; box-shadow: 0 18px 40px rgba(0,0,0,.4); }
  .palco video, .palco .foto-pronta { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .palco video.espelho { transform: scaleX(-1); }
  .palco .moldura { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.ativo { animation: flash .45s ease-out; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }

  /* Controles */
  .controles { padding: 14px 18px calc(var(--seguro-base) + 14px); }
  .molduras { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; }
  .opcao { width: 44px; height: 78px; border-radius: 8px; overflow: hidden; position: relative;
    background: linear-gradient(160deg, #6b5a52, #3b3330); border: 2px solid transparent; opacity: .7; transition: opacity .15s, border-color .15s; }
  .opcao.clara-fundo { background: linear-gradient(160deg, #f4ede2, #ddd3c6); }
  .opcao img { width: 100%; height: 100%; object-fit: cover; }
  .opcao[aria-pressed="true"] { border-color: var(--papel); opacity: 1; }
  .barra { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; max-width: 420px; margin: 0 auto; }
  .lateral { width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(250,243,232,.35);
    display: flex; align-items: center; justify-content: center; }
  .lateral.esq { justify-self: start; } .lateral.dir { justify-self: end; }
  .obturador { width: 78px; height: 78px; border-radius: 50%; border: 3px solid var(--papel); padding: 5px; transition: transform .1s; }
  .obturador span { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--papel); }
  .obturador:active { transform: scale(.92); }
  .dica { text-align: center; font-style: italic; font-size: 17px; color: rgba(250,243,232,.65); margin: 10px 0 0; }

  /* Depois da foto */
  .acoes { display: grid; gap: 10px; max-width: 420px; margin: 0 auto; }
  .btn { border-radius: 999px; padding: 15px 20px; font-family: "Josefin Sans", system-ui, sans-serif;
    font-size: 14px; letter-spacing: .14em; text-align: center; }
  .btn.principal { background: var(--papel); color: var(--musgo-escuro); }
  .btn.secundario { border: 1px solid rgba(250,243,232,.45); }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Abertura */
  .abertura { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px; background: radial-gradient(120% 70% at 50% 0%, var(--musgo) 0%, var(--musgo-escuro) 75%); }
  .abertura img { width: 96px; margin-bottom: 28px; }
  .abertura h1 { font-family: "Dancing Script", cursive; font-weight: 600; font-size: 56px; line-height: 1.05; margin: 0; }
  .abertura .data { font-family: "Josefin Sans", system-ui, sans-serif; font-weight: 300; letter-spacing: .38em; padding-left: .38em; font-size: 14px; margin: 16px 0 0; color: var(--salvia-claro); }
  .abertura p.texto { font-size: 21px; line-height: 1.45; max-width: 320px; margin: 30px 0 34px; color: rgba(250,243,232,.85); }
  .abertura .btn { min-width: 240px; }
  .erro { color: #f3c9b8; font-size: 18px; max-width: 320px; margin-top: 18px; }

  .aviso { position: fixed; left: 50%; bottom: calc(var(--seguro-base) + 150px); transform: translateX(-50%); z-index: 20;
    background: var(--papel); color: var(--musgo-escuro); padding: 12px 20px; border-radius: 999px; font-size: 18px; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
</style>
</head>
<body>

  <!-- Abertura: o toque do convidado libera a câmera (exigência do iPhone) -->
  <section class="abertura" id="abertura">
    <img src="molduras/monograma-creme.png" alt="Monograma JE" />
    <h1>Evillyn &amp; João</h1>
    <p class="data">19.12.2026</p>
    <p class="texto">Tire sua foto com a nossa moldura e compartilhe nos Stories.</p>
    <button class="btn principal" id="btn-abrir">Abrir a câmera</button>
    <button class="btn" id="btn-galeria-abertura" style="margin-top:6px">Usar uma foto da galeria</button>
    <p class="erro" id="erro" hidden></p>
  </section>

  <main class="palco-area">
    <div class="palco" id="palco">
      <video id="video" autoplay playsinline muted></video>
      <img class="foto-pronta" id="foto-pronta" alt="Sua foto com a moldura" hidden />
      <img class="moldura" id="moldura" src="molduras/monograma-clara.png" alt="" />
      <div class="flash" id="flash"></div>
    </div>
  </main>

  <!-- Modo câmera -->
  <section class="controles" id="controles-camera">
    <div class="molduras" role="group" aria-label="Escolher moldura">
      <button class="opcao" data-moldura="monograma-clara" aria-pressed="true" aria-label="Monograma, linhas claras"><img src="molduras/monograma-clara.png" alt="" /></button>
      <button class="opcao clara-fundo" data-moldura="monograma-verde" aria-pressed="false" aria-label="Monograma, linhas verdes"><img src="molduras/monograma-verde.png" alt="" /></button>
      <button class="opcao" data-moldura="lacre-clara" aria-pressed="false" aria-label="Lacre, linhas claras"><img src="molduras/lacre-clara.png" alt="" /></button>
      <button class="opcao clara-fundo" data-moldura="lacre-verde" aria-pressed="false" aria-label="Lacre, linhas verdes"><img src="molduras/lacre-verde.png" alt="" /></button>
    </div>
    <div class="barra">
      <button class="lateral esq" id="btn-galeria" aria-label="Escolher foto da galeria">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </button>
      <button class="obturador" id="btn-foto" aria-label="Tirar foto"><span></span></button>
      <button class="lateral dir" id="btn-virar" aria-label="Trocar câmera frontal ou traseira">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
      </button>
    </div>
    <p class="dica">Linhas verdes ficam melhores em fotos claras.</p>
  </section>

  <!-- Modo foto pronta -->
  <section class="controles" id="controles-pronta" hidden>
    <div class="acoes">
      <button class="btn principal" id="btn-compartilhar">Compartilhar nos Stories</button>
      <div class="duas">
        <button class="btn secundario" id="btn-salvar">Salvar foto</button>
        <button class="btn secundario" id="btn-outra">Tirar outra</button>
      </div>
    </div>
  </section>

  <input type="file" id="entrada-galeria" accept="image/*" hidden />
  <canvas id="canvas" width="1080" height="1920" hidden></canvas>
  <div class="aviso" id="aviso" role="status" hidden></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const W = 1080, H = 1920;              // tamanho do Stories
  const NOME_ARQUIVO = 'evillyn-e-joao-19-12-2026.jpg';

  let stream = null;
  let frontal = true;                    // começa na câmera de selfie
  let molduraAtual = 'monograma-clara';
  let fotoBlob = null;

  // Pré-carrega as molduras para desenhar no canvas sem atraso
  const imagens = {};
  ['monograma-clara', 'monograma-verde', 'lacre-clara', 'lacre-verde'].forEach((n) => {
    const img = new Image(); img.src = `molduras/${n}.png`; imagens[n] = img;
  });

  function aviso(texto) {
    const el = $('aviso'); el.textContent = texto; el.hidden = false;
    clearTimeout(aviso.t); aviso.t = setTimeout(() => (el.hidden = true), 2800);
  }

  // ---------- Câmera ----------
  async function abrirCamera() {
    pararCamera();
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: frontal ? 'user' : 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      const v = $('video');
      v.srcObject = stream;
      v.classList.toggle('espelho', frontal);
      $('abertura').hidden = true;
    } catch (e) {
      const erro = $('erro');
      erro.textContent = e && e.name === 'NotAllowedError'
        ? 'A câmera foi bloqueada. Libere o acesso nas configurações do navegador ou use uma foto da galeria.'
        : 'Não conseguimos abrir a câmera. Abra este link no Safari ou no Chrome, ou use uma foto da galeria.';
      erro.hidden = false;
      $('abertura').hidden = false;
    }
  }
  function pararCamera() { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; }

  $('btn-abrir').addEventListener('click', abrirCamera);
  $('btn-virar').addEventListener('click', () => { frontal = !frontal; abrirCamera(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) pararCamera();
    else if ($('abertura').hidden && !$('controles-camera').hidden) abrirCamera();
  });

  // ---------- Escolha da moldura ----------
  document.querySelectorAll('.opcao').forEach((b) => b.addEventListener('click', () => {
    molduraAtual = b.dataset.moldura;
    $('moldura').src = `molduras/${molduraAtual}.png`;
    document.querySelectorAll('.opcao').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));

  // ---------- Montagem da foto (foto + moldura em 1080×1920) ----------
  /** Desenha a fonte cobrindo 9:16, cortando o excesso (igual ao object-fit: cover). */
  function desenharCobrindo(ctx, fonte, fw, fh, espelhar) {
    const escala = Math.max(W / fw, H / fh);
    const dw = fw * escala, dh = fh * escala;
    ctx.save();
    if (espelhar) { ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(fonte, (W - dw) / 2, (H - dh) / 2, dw, dh);
    ctx.restore();
  }

  function montar(fonte, fw, fh, espelhar) {
    const ctx = $('canvas').getContext('2d');
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    desenharCobrindo(ctx, fonte, fw, fh, espelhar);
    ctx.drawImage(imagens[molduraAtual], 0, 0, W, H);
    return new Promise((res) => $('canvas').toBlob(res, 'image/jpeg', 0.92));
  }

  async function mostrarPronta(blob) {
    fotoBlob = blob;
    const img = $('foto-pronta');
    if (img.src) URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(blob);
    img.hidden = false;
    $('video').hidden = true;
    $('moldura').hidden = true;              // a moldura já está dentro da foto
    $('controles-camera').hidden = true;
    $('controles-pronta').hidden = false;
    pararCamera();
  }

  $('btn-foto').addEventListener('click', async () => {
    const v = $('video');
    if (!stream || !v.videoWidth) return;
    const f = $('flash'); f.classList.remove('ativo'); void f.offsetWidth; f.classList.add('ativo');
    navigator.vibrate?.(30);
    mostrarPronta(await montar(v, v.videoWidth, v.videoHeight, frontal));
  });

  // Foto da galeria
  const abrirGaleria = () => $('entrada-galeria').click();
  $('btn-galeria').addEventListener('click', abrirGaleria);
  $('btn-galeria-abertura').addEventListener('click', abrirGaleria);
  $('entrada-galeria').addEventListener('change', async (e) => {
    const arquivo = e.target.files[0];
    if (!arquivo) return;
    const bmp = await createImageBitmap(arquivo).catch(() => null);
    if (!bmp) { aviso('Não consegui abrir essa foto.'); return; }
    $('abertura').hidden = true;
    mostrarPronta(await montar(bmp, bmp.width, bmp.height, false));
    e.target.value = '';
  });

  // ---------- Depois da foto ----------
  $('btn-compartilhar').addEventListener('click', async () => {
    const arquivo = new File([fotoBlob], NOME_ARQUIVO, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
      try { await navigator.share({ files: [arquivo] }); }
      catch (e) { if (e.name !== 'AbortError') aviso('Não deu para compartilhar. Salve a foto e poste pelo Instagram.'); }
    } else {
      salvar();
      aviso('Foto salva. Agora é só postar pelo Instagram.');
    }
  });

  function salvar() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(fotoBlob); a.download = NOME_ARQUIVO; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  $('btn-salvar').addEventListener('click', async () => {
    // No iPhone, a folha de compartilhar tem "Salvar imagem", que manda direto para o Fotos
    const arquivo = new File([fotoBlob], NOME_ARQUIVO, { type: 'image/jpeg' });
    if (/iPhone|iPad/.test(navigator.userAgent) && navigator.canShare?.({ files: [arquivo] })) {
      try { await navigator.share({ files: [arquivo] }); } catch {}
    } else salvar();
  });

  $('btn-outra').addEventListener('click', () => {
    $('foto-pronta').hidden = true;
    $('video').hidden = false;
    $('moldura').hidden = false;
    $('controles-pronta').hidden = true;
    $('controles-camera').hidden = false;
    abrirCamera();
  });
})();
</script>
</body>
</html>
